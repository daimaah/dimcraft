# DimKnit — deployable as a Portainer stack (Stacks → Add stack → Repository,
# pointing at the dimcraft repo) or locally with: docker compose up -d --build
#
# The named volume keeps self-hosted encrypted short links; charts themselves
# live in each user's browser (IndexedDB), so upgrading is just a redeploy.
# Optional env: DIMCRAFT_MAX_AGE_HOURS — days an unused short link survives
# (default 720 = 30 days, refreshed every time the link is opened).

services:
  dimknit:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP: dimknit
    image: dimknit:latest
    container_name: dimknit
    restart: unless-stopped
    ports:
      # change the host port in Portainer's environment editor (DIMKNIT_PORT)
      - "${DIMKNIT_PORT:-8081}:80"
    volumes:
      - dimknit-data:/data

volumes:
  dimknit-data:

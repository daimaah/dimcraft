# DimCraft stack — DimCrochet + DimKnit, deployable as a Portainer stack
# (Stacks → Add stack → Repository, pointing at this repo) or locally with:
#   docker compose up -d --build
#
# BOTH apps run by default — DimCrochet on 8080, DimKnit on 8081 — each with
# its own data volume, and they detect each other automatically. Only want
# one of them? Comment the other service block out; its volume declaration
# below can stay (compose just leaves it unused).
#
# The named volumes keep the self-hosted encrypted short links; charts live in
# each user's browser (IndexedDB), so upgrading is just a redeploy.
# Optional env (Portainer's environment editor):
#   DIMCROCHET_PORT / DIMKNIT_PORT — host ports (defaults: 8080 / 8081)
#   DIMCRAFT_MAX_AGE_HOURS — days an unused short link survives
#     (default 720 = 30 days, refreshed every time the link is opened)

services:
  dimcrochet:
    build: .
    image: dimcrochet:latest
    container_name: dimcrochet
    restart: unless-stopped
    ports:
      # change the host port in Portainer's environment editor (DIMCROCHET_PORT)
      - "${DIMCROCHET_PORT:-8080}:80"
    environment:
      # where the browser should look for DimKnit — follows DIMKNIT_PORT
      # automatically; replace with SIBLING_URL (a full URL) behind a proxy
      - SIBLING_PORT=${DIMKNIT_PORT:-8081}
    volumes:
      - dimcrochet-data:/data

  dimknit:
    build:
      context: .
      args:
        APP: dimknit
    image: dimknit:latest
    container_name: dimknit
    restart: unless-stopped
    ports:
      # change the host port in Portainer's environment editor (DIMKNIT_PORT)
      - "${DIMKNIT_PORT:-8081}:80"
    environment:
      # where the browser should look for DimCrochet — follows DIMCROCHET_PORT
      - SIBLING_PORT=${DIMCROCHET_PORT:-8080}
    volumes:
      - dimknit-data:/data

volumes:
  dimcrochet-data:
  # commenting out the dimknit service above leaves this unused but harmless
  dimknit-data:
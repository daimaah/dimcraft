name: Test and publish Docker images

# Tests run on every push and pull request; each app's Docker image is
# published only after the tests (including the golden compatibility
# fixtures) pass. Branch model: `develop` builds publish the `develop` tag;
# the default branch `main` carries released code and refreshes `main` +
# `latest`. `v*` tags publish DimCrochet releases, `dimknit-v*` tags publish
# DimKnit releases (each as its own version tag + latest for the app).
# `core-v*` tags mark shared-kernel/sidecar releases — they run the tests
# but build no images (the core ships inside the apps).

on:
  push:
    branches: [main, develop]
    tags: ['v*', 'dimknit-v*', 'core-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    needs: test
    # core releases carry no images — the core ships inside the app images
    if: ${{ !startsWith(github.ref, 'refs/tags/core-v') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [dimcrochet, dimknit]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          # pinned to the per-app package names, not derived from the repo
          # (the repo is `dimcraft`): an unpinned name would publish under a
          # name that drifts with the repo and strand existing deployments.
          # DimCrochet keeps ghcr.io/daimaah/dimcrochet, DimKnit gets
          # ghcr.io/daimaah/dimknit.
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}
          # default branch builds always refresh :latest, so deployments
          # tracking it get the newest passing build, not just releases
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: APP=${{ matrix.app }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
